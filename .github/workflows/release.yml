name: Release

# Builds the Windows installer and publishes a GitHub Release.
# Trigger: push a tag like "v1.0.0".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('livecut/__init__.py').read_text(encoding='utf-8')).group(1))"
          Write-Host "Building LiveCut $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate app icon
        run: python packaging/make_icon.py

      - name: Build executables (PyInstaller)
        run: pyinstaller packaging/livecut.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "packaging\installer.iss"

      - name: Create checksums
        shell: pwsh
        run: |
          $installer = "dist\installer\LiveCut-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  LiveCut-Setup-${{ steps.version.outputs.version }}.exe" | Out-File -Encoding ascii dist\installer\SHA256SUMS.txt
          Get-Content dist\installer\SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LiveCut ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/installer/LiveCut-Setup-${{ steps.version.outputs.version }}.exe
            dist/installer/SHA256SUMS.txt
