target-version = "py310"
line-length = 100

exclude = [
    ".venv",
    "venv",
    "ffmpeg-*",
    "output",
    "temp",
    ".superpowers",
]

[lint]
# Conservative rule set: real errors only, so CI stays green on the
# existing codebase while still catching unused imports/undefined names.
select = ["E4", "E7", "E9", "F"]
