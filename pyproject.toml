[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livecut"
dynamic = ["version"]
description = "Local, 100% offline automatic highlight clip generator for Twitch / YouTube / Kick VODs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "matheusabdao" }]
keywords = ["vod", "highlights", "clips", "twitch", "kick", "youtube", "whisper"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0",
    "soundfile>=0.12",
    "yt-dlp>=2024.1.0",
    "curl-cffi>=0.7",
    "huggingface_hub>=0.20",
    "pywebview>=5.0",
    "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
livecut = "livecut.app:main"

[tool.setuptools]
packages = ["livecut"]

[tool.setuptools.dynamic]
version = { attr = "livecut.__version__" }
